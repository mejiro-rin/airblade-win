[package]
name = "airplay_core"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Devices_Properties",
    "Win32_Media_KernelStreaming",
    "Win32_Security",
] }
ringbuf = "0.4"
hound = "3.5"       # 用于验证阶段写WAV文件

[lib]
name = "airplay_core"
crate-type = ["cdylib", "rlib"]